name: Release

# Publishes a release when a version tag is pushed:
#   git tag v0.6.0 && git push origin v0.6.0
# The tag must match the version in packages/*/package.json (scripts/set-version.mjs sets them).
# Each target is its own job, so one that is not set up yet does not stop the others.
# Run it by hand (Actions → Release → Run workflow) to build and test without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publisher: ${{ steps.version.outputs.publisher }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versions match the tag
        id: version
        run: |
          v=$(node -p "require('./packages/vscode/package.json').version")
          for p in packages/cli packages/core; do
            pv=$(node -p "require('./$p/package.json').version")
            if [ "$pv" != "$v" ]; then echo "::error::$p is $pv, the extension is $v"; exit 1; fi
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publisher=$(node -p "require('./packages/vscode/package.json').publisher")" >> "$GITHUB_OUTPUT"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package
      - run: node scripts/pack-cli.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          # The CLI carries the Claude Code plugin, whose manifest is in a dot folder
          # (dist/claude-plugin/.claude-plugin); artifacts leave dot folders out unless told.
          include-hidden-files: true
          path: |
            packages/vscode/kvali-${{ steps.version.outputs.version }}.vsix
            packages/cli/npm-package/

  github-release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: GitHub release with the VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          vsix="out/vscode/kvali-$V.vsix"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$V" "$vsix" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$V" "$vsix" --repo "$GITHUB_REPOSITORY" --title "Kvali $V" --generate-notes
          fi

  vscode-marketplace:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Marketplace trusted publishing: no token is stored anywhere
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Publish to the VS Code Marketplace
        env:
          V: ${{ needs.build.outputs.version }}
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "out/vscode/kvali-$V.vsix"

  open-vsx:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Open VSX is not set up yet
        if: env.OVSX_PAT == ''
        run: echo "::warning::Add the OVSX_PAT repository secret to publish to Open VSX (see RELEASING.md)."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.OVSX_PAT != ''
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.OVSX_PAT != ''
        with:
          name: release
          path: out
      - name: Open VSX namespace (created by the first release)
        if: env.OVSX_PAT != ''
        env:
          NS: ${{ needs.build.outputs.publisher }}
        run: |
          if out=$(npx --yes ovsx@1.3.0 create-namespace "$NS" -p "$OVSX_PAT" 2>&1); then
            echo "Created the Open VSX namespace $NS."
          elif grep -q "Namespace already exists" <<<"$out"; then
            echo "The Open VSX namespace $NS exists."
          else
            echo "$out"
            echo "::error::Could not create the Open VSX namespace $NS (see RELEASING.md)."
            exit 1
          fi
      - name: Publish to Open VSX (Antigravity, Cursor, Windsurf, VSCodium)
        if: env.OVSX_PAT != ''
        env:
          V: ${{ needs.build.outputs.version }}
        run: npx --yes ovsx@1.3.0 publish "out/vscode/kvali-$V.vsix" -p "$OVSX_PAT"

  npm:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing and provenance: no token is stored anywhere
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm 11.5.1 or newer (trusted publishing)
        run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Publish the CLI to npm
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          NAME=$(node -p "require('./out/cli/npm-package/package.json').name")
          if ! npm view "$NAME" version >/dev/null 2>&1; then
            echo "::warning::$NAME is not on npm yet: publish a placeholder by hand, then make this workflow its trusted publisher (see RELEASING.md)."
            exit 0
          fi
          if [ "$(npm view "$NAME@$V" version 2>/dev/null)" = "$V" ]; then
            echo "::notice::$NAME@$V is already on npm."
            exit 0
          fi
          # What npm would publish must hold the command, the notices and the Claude Code plugin
          # with its manifest (without it `kvali setup` cannot install the plugin).
          PACKED=$(npm pack ./out/cli/npm-package --dry-run --json | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s)[0].files.map((f) => f.path).join("\n")))')
          for f in dist/kvali.mjs THIRD_PARTY_NOTICES.md dist/claude-plugin/.claude-plugin/plugin.json dist/claude-plugin/.claude-plugin/marketplace.json dist/claude-plugin/hooks/hooks.json; do
            if ! printf '%s\n' "$PACKED" | grep -qxF "$f"; then
              echo "::error::$f is missing from the npm package"
              exit 1
            fi
          done
          npm publish ./out/cli/npm-package --access public --provenance
